[build]
command = "pnpm build"
publish = "dist"

[build.environment]
NODE_VERSION = "26"
PNPM_VERSION = "10.34.9"

# Static export: no SPA fallback redirect.

[[headers]]
for = "/_astro/*"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*"

[headers.values]
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Machine-readable files: explicit UTF-8 types so ₹, quotes and dashes survive.
[[headers]]
for = "/*.md"

# Short URLs for the section pages.
[[redirects]]
from = "/projects"
to = "/work/"
status = 301

[[redirects]]
from = "/papers"
to = "/research/"
status = 301

[[redirects]]
from = "/blog"
to = "/writing/"
status = 301

[[redirects]]
from = "/articles"
to = "/writing/"
status = 301

[[redirects]]
from = "/skills"
to = "/expertise/"
status = 301

[[redirects]]
from = "/exp"
to = "/#experience"
status = 301

[[redirects]]
from = "/experience"
to = "/#experience"
status = 301

[[redirects]]
from = "/certifications"
to = "/credentials/"
status = 301

[[redirects]]
from = "/awards"
to = "/credentials/"
status = 301

# Crawlers and tools often guess /sitemap.xml; the real index is sitemap-index.xml.
[[redirects]]
from = "/sitemap.xml"
to = "/sitemap-index.xml"
status = 301

[headers.values]
Content-Type = "text/markdown; charset=utf-8"
X-Robots-Tag = "noindex"

[[headers]]
for = "/llms.txt"

[headers.values]
Content-Type = "text/plain; charset=utf-8"

[[headers]]
for = "/llms-full.txt"

[headers.values]
Content-Type = "text/plain; charset=utf-8"

[[headers]]
for = "/llms.json"

[headers.values]
Content-Type = "application/json; charset=utf-8"
