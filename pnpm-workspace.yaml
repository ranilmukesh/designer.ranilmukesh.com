# pnpm 10 settings. Catalogs pin the dependency ranges used in package.json.
overrides:
  '@eslint/config-array>minimatch': ^11.0.3
  '@typescript-eslint/typescript-estree>minimatch': ^11.0.3
  eslint-plugin-sonarjs>minimatch: ^11.0.3
  eslint>minimatch: ^11.0.3
  micromark-extension-math>katex: ^0.19.1

packageExtensions:
  '@astrojs/astro2tsx@0.1.3':
    dependencies:
      '@emnapi/runtime': 1.11.3

onlyBuiltDependencies:
  - esbuild
  - sharp

catalogs:
  dev:
    '@antfu/eslint-config': ^10.0.0
    '@axe-core/playwright': ^4.14.0
    '@playwright/test': ^1.64.1
    eslint: ^10.14.0
    eslint-plugin-astro: ^3.2.1
    eslint-plugin-slop: ^0.1.3
    eslint-plugin-sonarjs: ^4.2.2
    knip: ^6.44.1
    tsx: ^4.23.15
    vitest: ^5.0.5
  prod:
    '@astrojs/check': ^0.9.12
    '@astrojs/sitemap': ^3.7.4
    '@fontsource-variable/jetbrains-mono': ^5.3.0
    '@fontsource-variable/space-grotesk': ^5.3.0
    '@fontsource/anton': ^5.3.0
    '@fontsource/instrument-serif': ^5.3.0
    '@iconify-json/mdi': ^1.2.3
    '@iconify-json/ri': ^1.2.10
    '@iconify-json/simple-icons': ^1.2.101
    '@tailwindcss/vite': ^4.3.3
    astro: 7.4.12
    gsap: ^3.15.0
    lenis: ^1.3.27
    sharp: ^0.35.5
    tailwindcss: ^4.3.3
    typescript: ^6.0.3
    zod: ^4.6.7
